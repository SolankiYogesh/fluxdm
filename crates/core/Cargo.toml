[package]
name = "fluxdm-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aes = "0.9.4"
anyhow = "1.0.105"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = "0.4.45"
digest_auth = "0.3.1"
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
m3u8-rs = "6.0.1"
md-5 = "0.11.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "socks", "http2", "system-proxy"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.2"
suppaftp = { version = "13.0.0", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
url = "2.5.9"

[dev-dependencies]
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
