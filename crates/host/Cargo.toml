[package]
name = "fluxdm-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "fluxdm-host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
fluxdm-core = { version = "0.1.0", path = "../core" }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
